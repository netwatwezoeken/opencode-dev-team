name: Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, test & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Installs the toolchain pinned in mise.toml (bun 1.3.2, etc.) and
      # caches it, so CI runs the exact same versions as local dev.
      - name: Set up mise
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate package.json
        run: mise run pkgjsonlint

      - name: Typecheck
        run: mise run typecheck

      - name: Test
        run: mise run test

      - name: Build
        run: mise run build
